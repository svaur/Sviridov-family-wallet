spring:
  application:
    name: sviridov-family-wallet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sviridov_wallet}
    username: ${DB_USERNAME:sviridov}
    password: ${DB_PASSWORD:sviridov}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  servlet:
    session:
      timeout: 14d
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    ru.sviridov.wallet: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
