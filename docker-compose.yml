services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sviridov_wallet}
      POSTGRES_USER: ${POSTGRES_USER:-sviridov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sviridov}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sviridov} -d ${POSTGRES_DB:-sviridov_wallet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sviridov_wallet}
      DB_USERNAME: ${POSTGRES_USER:-sviridov}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sviridov}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
