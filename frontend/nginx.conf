server {
    listen 80;
    server_name _;

    # Statement PDFs and bank-feed screenshots may be up to 10 MB; leave a bit
    # of headroom for the multipart envelope. nginx defaults to 1 MB, which
    # otherwise rejects any upload with 413 before it reaches the backend.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Screenshot import OCRs each operation in a separate Tesseract pass, so a
        # single upload can take a couple of minutes. Don't cut it off at 60 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Spring Boot Actuator
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI / Swagger UI (served by backend)
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA (client-side routing fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
